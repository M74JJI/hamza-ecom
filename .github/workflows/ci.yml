name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hajzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hajzen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hajzen?schema=public
      APP_URL: http://localhost:3000
      SMTP_USER: ci@example.com
      SMTP_PASS: ci-placeholder
      GMAIL_USER: ci@example.com
      GMAIL_APP_PASS: ci-placeholder
      AUTH_EMAIL_FROM: ci@example.com
      SMTP_SECURE: "true"
      RATE_LIMIT_HASH_SECRET: ci-rate-limit-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration history
        run: bun run prisma:migrate:deploy

      - name: Run quality gate
        run: bun run ci
