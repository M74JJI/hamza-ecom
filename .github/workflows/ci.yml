name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hajzen?schema=public
      APP_URL: http://localhost:3000
      SMTP_USER: ci@example.com
      SMTP_PASS: ci-placeholder
      GMAIL_USER: ci@example.com
      GMAIL_APP_PASS: ci-placeholder
      AUTH_EMAIL_FROM: ci@example.com
      SMTP_SECURE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run ci
