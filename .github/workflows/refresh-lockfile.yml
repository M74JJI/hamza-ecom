name: Refresh lockfile

on:
  push:
    branches:
      - chore/dependencies-upgrade-next-react-bun

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/dependencies-upgrade-next-react-bun

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Refresh bun.lock
        run: bun install

      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore:dependencies:refresh-bun-lockfile"
          git push origin HEAD:chore/dependencies-upgrade-next-react-bun
