name: Generate Prisma baseline

on:
  push:
    branches:
      - database/migrations-add-safe-baseline

permissions:
  contents: write

concurrency:
  group: generate-prisma-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://baseline:baseline@localhost:5432/baseline?schema=public
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: database/migrations-add-safe-baseline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate baseline migration
        run: |
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/0_init
          bunx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script > prisma/migrations/0_init/migration.sql
          test -s prisma/migrations/0_init/migration.sql

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/0_init/migration.sql
          if git diff --cached --quiet; then
            echo "Baseline is already current"
            exit 0
          fi
          git commit -m "database:migrations:add-prisma-baseline"
          git push origin HEAD:database/migrations-add-safe-baseline
